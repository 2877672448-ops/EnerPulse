spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:enerpulse}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

my:
  mqtt:
    embedded: false
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}

jwt:
  secret: ${JWT_SECRET:default-secret-change-me}
  expiration: 86400000